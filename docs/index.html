<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1419">
<title>Gráficos de Ações B3</title>
<script src="https://unpkg.com/lightweight-charts@5.0.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
  :root{--bg:#0f1419;--card:#18202a;--line:#2a3441;--tx:#e6edf3;--mut:#8b98a5;--up:#26a69a;--dn:#ef5350;--acc:#4da3ff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-bottom:env(safe-area-inset-bottom)}
  header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 12px}
  h1{font-size:16px;margin:0 0 8px;display:flex;justify-content:space-between;align-items:baseline}
  h1 small{font-weight:400;color:var(--mut);font-size:12px}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  input,select{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:16px;min-width:0}
  input{flex:1 1 120px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
  .chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);color:var(--mut);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
  .chip.on{color:var(--tx);border-color:var(--acc);background:#16314d}
  #list{padding:6px 8px 40px}
  .item{display:grid;grid-template-columns:34px 1fr auto;gap:8px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0;cursor:pointer}
  .item:active{background:#1d2937}
  .rk{color:var(--mut);font-size:12px;text-align:center}
  .tk{font-weight:600}.sub{color:var(--mut);font-size:12px}
  .px{text-align:right}.up{color:var(--up)}.dn{color:var(--dn)}
  .tag{font-size:11px;padding:1px 6px;border-radius:6px;border:1px solid var(--line);margin-left:4px;color:var(--mut)}
  #view{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column}
  #view.show{display:flex}
  #vbar{display:flex;align-items:center;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);padding-top:max(8px,env(safe-area-inset-top))}
  #vbar button{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:15px}
  #vt{flex:1;font-weight:600}
  #vinfo{display:flex;gap:12px;overflow-x:auto;padding:6px 12px;font-size:12px;color:var(--mut);border-bottom:1px solid var(--line);white-space:nowrap}
  #vinfo b{color:var(--tx);font-weight:600}
  #cwrap{position:relative;flex:1;min-height:0}
  #chart{position:absolute;inset:0}
  #plabels{position:absolute;inset:0;pointer-events:none;z-index:3}
  .plab{position:absolute;right:0;font-size:11px;color:var(--mut);background:#0f1419cc;padding:1px 6px;border-radius:4px;white-space:nowrap}
  #plegend{position:absolute;left:6px;top:4px;z-index:3;pointer-events:none;display:flex;gap:8px;flex-wrap:wrap;max-width:75%;font-size:10px;color:var(--mut);background:#0f1419b3;padding:2px 6px;border-radius:4px}
  #plegend i{display:inline-block;width:12px;height:0;border-top:2px solid;vertical-align:middle;margin-right:3px}
  .hbtn{background:var(--card);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:15px;white-space:nowrap}
  #modal{position:fixed;inset:0;z-index:30;background:#000b;display:none;align-items:center;justify-content:center;padding:12px}
  #modal.show{display:flex}
  .mcard{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:100%;max-width:560px;max-height:88vh;display:flex;flex-direction:column}
  .mhead{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
  #mbody{overflow-y:auto;padding:6px 12px 14px}
  #mbody .li{padding:10px 0;border-bottom:1px solid var(--line)}
  #mbody .li:last-child{border-bottom:0}
  #mbody .li b{display:block;margin-bottom:2px}
  #mbody .li p{margin:0 0 4px;font-size:13px;color:var(--tx)}
  #mbody .li small{display:block;font-size:12px;color:var(--acc)}
  #mbody h3{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 0}
  .empty{color:var(--mut);text-align:center;padding:40px 0}
</style>
</head>
<body>
<header>
  <h1>Ações B3 <small id="upd"></small></h1>
  <div class="row">
    <input id="q" placeholder="Buscar ticker (ex: PETR4)" autocapitalize="characters" autocomplete="off">
    <select id="ord">
      <option value="rank">Liquidez</option>
      <option value="chg">Variação do dia</option>
      <option value="rsi">RSI (menor)</option>
      <option value="t">A–Z</option>
    </select>
    <button id="info" class="hbtn">ⓘ Legenda</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<div id="modal"><div class="mcard">
  <div class="mhead"><b>Legenda dos filtros</b><button id="mclose" class="hbtn">Fechar</button></div>
  <div id="mbody"></div>
</div></div>
<div id="list"></div>

<div id="view">
  <div id="vbar"><button id="back">‹ Voltar</button><span id="vt"></span><button id="prev">←</button><button id="next">→</button></div>
  <div id="vinfo"></div>
  <div id="cwrap"><div id="chart"></div><div id="plabels"></div>
    <div id="plegend"><span><i style="border-color:#4da3ff"></i>MA9</span><span><i style="border-color:#f06292"></i>SMA20</span><span><i style="border-color:#ffa726"></i>EMA50</span><span><i style="border-color:#e6edf3"></i>EMA200</span><span><i style="border-color:#5b6773;border-top-style:dashed"></i>Bollinger</span></div></div>
</div>

<script>
const $ = s => document.querySelector(s);
let ITEMS = [], shown = [], filter = 'all', chart = null, curIdx = -1;

const TOP_N = 50, RSI_LOW = 35, RSI_HIGH = 70;
const FILTERS = [
  ['all','Todos'],['top50','Top 50 liquidez'],
  ['rsiLow','RSI < 35'],['rsiHigh','RSI > 70'],
  ['m9gt20','MA9 acima da SMA20'],
  ['crossUp','Cruz. MA9↑SMA20 ({d}d)'],['crossDn','Cruz. MA9↓SMA20 ({d}d)'],
  ['c2050Up','Cruz. SMA20↑EMA50 ({d}d)'],['c2050Dn','Cruz. SMA20↓EMA50 ({d}d)'],
  ['divAny','Diverg. de alta (RSI ou MACD)'],['divRsi','Diverg. de alta RSI'],['divMacd','Diverg. de alta MACD']
];
let CD = 3; // janela de cruzamento em pregões (vem do index.json)
// parâmetros usados no cálculo (vêm do index.json, gerado pelo build.py; estes são só valores iniciais)
let CFG = {cross_days:3, liq_days:60, div:{pivot:3,recent:10,min_gap:5,max_gap:60,price_tol_pct:0.3,rsi_margin:1,rsi_max:45}};
const PRED = {
  all:()=>true, top50:x=>x.rank<=TOP_N,
  rsiLow:x=>x.rsi!=null&&x.rsi<RSI_LOW, rsiHigh:x=>x.rsi!=null&&x.rsi>RSI_HIGH,
  m9gt20:x=>x.m9gt20===true,
  crossUp:x=>x.cross===1, crossDn:x=>x.cross===-1,
  c2050Up:x=>x.c2050===1, c2050Dn:x=>x.c2050===-1,
  divAny:x=>x.divrsi===true||x.divmacd===true, divRsi:x=>x.divrsi===true, divMacd:x=>x.divmacd===true
};

function fmtMoney(v){ if(v>=1e9) return (v/1e9).toFixed(2)+' bi'; if(v>=1e6) return (v/1e6).toFixed(1)+' mi'; return Math.round(v/1e3)+' mil'; }

function render(){
  const q = $('#q').value.trim().toUpperCase(), ord = $('#ord').value;
  shown = ITEMS.filter(PRED[filter]).filter(x => !q || x.t.includes(q));
  shown.sort((a,b)=> ord==='t' ? a.t.localeCompare(b.t)
    : ord==='rank' ? a.rank-b.rank
    : ord==='chg' ? (b.chg??-1e9)-(a.chg??-1e9)
    : (a.rsi??1e9)-(b.rsi??1e9));
  $('#list').innerHTML = shown.length ? shown.map((x,i)=>`
    <div class="item" data-i="${i}">
      <div class="rk">#${x.rank}</div>
      <div><span class="tk">${x.t}</span>${x.cross===1?'<span class="tag up">9↑20</span>':''}${x.cross===-1?'<span class="tag dn">9↓20</span>':''}${x.c2050===1?'<span class="tag up">20↑50</span>':''}${x.c2050===-1?'<span class="tag dn">20↓50</span>':''}${x.divrsi?'<span class="tag up">div RSI</span>':''}${x.divmacd?'<span class="tag up">div MACD</span>':''}
        <div class="sub">RSI ${x.rsi??'–'} · Liq ${fmtMoney(x.liq)}</div></div>
      <div class="px">R$ ${x.close?.toFixed(2)??'–'}<div class="${x.chg>=0?'up':'dn'}">${x.chg>=0?'+':''}${x.chg??'–'}%</div></div>
    </div>`).join('') : '<div class="empty">Nenhum ativo encontrado</div>';
}

function buildChips(){
  $('#chips').innerHTML = FILTERS.map(([k,l])=>`<div class="chip ${k===filter?'on':''}" data-k="${k}">${l.replace('{d}',CD)}</div>`).join('');
}

async function openTicker(i){
  curIdx = i; const it = shown[i]; if(!it) return;
  $('#view').classList.add('show'); $('#vt').textContent = it.t;
  $('#vinfo').innerHTML = `<span>Rank <b>#${it.rank}</b></span><span>R$ <b>${it.close}</b></span><span>RSI <b>${it.rsi??'–'}</b></span><span>MACD <b>${it.macd??'–'}</b></span><span>Liq <b>${fmtMoney(it.liq)}</b></span><span>${it.date}</span>${it.divrsi?'<span style="color:#00e676">Diverg. alta RSI</span>':''}${it.divmacd?'<span style="color:#40c4ff">Diverg. alta MACD</span>':''}`;
  const d = await (await fetch(`data/${it.t}.json`)).json();
  draw(d);
}

function draw(d){
  if(chart){ chart.remove(); chart = null; }
  const L = LightweightCharts;
  chart = L.createChart($('#chart'), {
    autoSize:true,
    layout:{background:{color:'#0f1419'},textColor:'#8b98a5',panes:{separatorColor:'#2a3441'}},
    grid:{vertLines:{color:'#1a222c'},horzLines:{color:'#1a222c'}},
    rightPriceScale:{borderColor:'#2a3441'}, timeScale:{borderColor:'#2a3441',rightOffset:3},
    crosshair:{mode:L.CrosshairMode.Normal}
  });
  const line = (arr,color,pane,opts={}) => {
    const s = chart.addSeries(L.LineSeries,{color,lineWidth:1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false,...opts},pane);
    s.setData(d.t.map((t,i)=>arr[i]==null?{time:t}:{time:t,value:arr[i]})); return s;
  };
  // pane 0: preço
  // preenchimento da banda de Bollinger (azul ~80% transparente): área sob a banda superior em azul,
  // coberta por uma área na cor do fundo sob a banda inferior. Vêm antes dos candles para ficar atrás.
  const band = (arr,top,bottom) => {
    const s = chart.addSeries(L.AreaSeries,{lineVisible:false,topColor:top,bottomColor:bottom,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false},0);
    s.setData(d.t.map((t,i)=>arr[i]==null?{time:t}:{time:t,value:arr[i]}));
  };
  band(d.bbu,'rgba(77,163,255,0.2)','rgba(77,163,255,0.2)');
  band(d.bbl,'#0f1419','#0f1419');
  const cs = chart.addSeries(L.CandlestickSeries,{upColor:'#26a69a',downColor:'#ef5350',borderVisible:false,wickUpColor:'#26a69a',wickDownColor:'#ef5350'},0);
  cs.setData(d.t.map((t,i)=>({time:t,open:d.o[i],high:d.h[i],low:d.l[i],close:d.c[i]})));
  line(d.ma9,'#4da3ff',0); line(d.ema50,'#ffa726',0); line(d.ema200,'#e6edf3',0);
  line(d.sma20,'#f06292',0); line(d.bbu,'#5b6773',0,{lineStyle:2}); line(d.bbl,'#5b6773',0,{lineStyle:2});
  // pane 1: volume
  const vs = chart.addSeries(L.HistogramSeries,{priceFormat:{type:'volume'},priceLineVisible:false,lastValueVisible:false},1);
  vs.setData(d.t.map((t,i)=>({time:t,value:d.v[i],color:i>0&&d.c[i]>=d.c[i-1]?'#26a69a99':'#ef535099'})));
  // pane 2: MACD
  const hs = chart.addSeries(L.HistogramSeries,{priceLineVisible:false,lastValueVisible:false},2);
  hs.setData(d.t.map((t,i)=>d.hist[i]==null?{time:t}:{time:t,value:d.hist[i],color:d.hist[i]>=0?'#26a69a99':'#ef535099'}));
  line(d.macd,'#4da3ff',2); line(d.sig,'#ffa726',2);
  // pane 3: RSI
  const rs = line(d.rsi,'#b388ff',3,{lastValueVisible:true});
  rs.createPriceLine({price:70,color:'#26a69a',lineStyle:2,lineWidth:1,axisLabelVisible:false});
  rs.createPriceLine({price:30,color:'#ef5350',lineStyle:2,lineWidth:1,axisLabelVisible:false});
  // pane 4: Estocástico lento
  const k = line(d.stk,'#4da3ff',4); line(d.std,'#ef5350',4);
  k.createPriceLine({price:80,color:'#26a69a',lineStyle:2,lineWidth:1,axisLabelVisible:false});
  k.createPriceLine({price:20,color:'#ef5350',lineStyle:2,lineWidth:1,axisLabelVisible:false});
  // pane 5: ATR
  line(d.atr,'#4da3ff',5,{lastValueVisible:true});
  // divergências de alta: liga os dois fundos no preço e no indicador (verde = RSI, azul claro = MACD)
  const seg = (pts,color,pane) => {
    const s = chart.addSeries(L.LineSeries,{color,lineWidth:2,lineStyle:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false},pane);
    s.setData(pts);
  };
  const DV = d.div || {};
  [['rsi','#00e676',3],['macd','#40c4ff',2]].forEach(([k,col,pane])=>{
    const v = DV[k]; if(!v || !d.t.includes(v.d1) || !d.t.includes(v.d2)) return;
    seg([{time:v.d1,value:v.p1},{time:v.d2,value:v.p2}],col,0);
    seg([{time:v.d1,value:v.v1},{time:v.d2,value:v.v2}],col,pane);
  });
  // proporções dos painéis
  const ps = chart.panes(); const f=[6,1.2,1.5,1.5,1.5,1.2];
  ps.forEach((p,i)=>p.setStretchFactor?.(f[i]));
  chart.timeScale().setVisibleLogicalRange({from:d.t.length-90,to:d.t.length+3});
  setTimeout(placeLabels,80);
}

// legenda de cada indicador, no canto inferior direito do respectivo painel
const PLABELS = [null,
  'Volume',
  '<span style="color:#4da3ff">MACD (12,26,9)</span> · <span style="color:#ffa726">Sinal</span> · Histograma',
  '<span style="color:#b388ff">RSI (14)</span>',
  'Estocástico lento · <span style="color:#4da3ff">%K (5)</span> · <span style="color:#ef5350">%D (3)</span>',
  '<span style="color:#4da3ff">ATR (14)</span>'];
function placeLabels(){
  const box = $('#plabels'); if(!chart || !box) return;
  let w = 60; try{ w = chart.priceScale('right').width() || 60; }catch(e){}
  let y = 0, html = '';
  chart.panes().forEach((p,i)=>{
    const h = p.getHeight();
    if(PLABELS[i]) html += `<div class="plab" style="top:${y+h-22}px;right:${w+6}px">${PLABELS[i]}</div>`;
    y += h + 1;
  });
  box.innerHTML = html;
}
new ResizeObserver(()=>placeLabels()).observe($('#cwrap'));

$('#list').addEventListener('click',e=>{ const el=e.target.closest('.item'); if(el) openTicker(+el.dataset.i); });
$('#chips').addEventListener('click',e=>{ const c=e.target.closest('.chip'); if(!c) return; filter=c.dataset.k; buildChips(); render(); });
$('#q').addEventListener('input',render); $('#ord').addEventListener('change',render);
// ---- legenda dos filtros (descrição + configuração atual) ----
function legendHtml(){
  const c = CFG, dv = c.div || {}, cd = c.cross_days;
  const cross = `Janela: ${cd} ${cd===1?'pregão':'pregões'} (conta o cruzamento mais recente dentro da janela)`;
  const divCfg = extra => `Fundos: mínima mais baixa entre ${dv.pivot} pregões antes e ${dv.pivot} depois (confirmação com ${dv.pivot} pregões de atraso) · `
    + `2º fundo nos últimos ${dv.recent} pregões e ainda não rompido · distância entre os fundos: ${dv.min_gap} a ${dv.max_gap} pregões · `
    + `2º fundo pelo menos ${dv.price_tol_pct}% abaixo do 1º · ${extra}`;
  const rsiCfg = `RSI do 2º fundo pelo menos ${dv.rsi_margin} ponto acima do 1º · RSI do 1º fundo abaixo de ${dv.rsi_max}`;
  const macdCfg = 'MACD (12,26,9) do 2º fundo acima do 1º · MACD do 1º fundo abaixo de zero';
  const groups = [
    ['Liquidez e ordenação', [
      ['Todos','Mostra todos os ativos, sem filtro.','—'],
      [`Top ${TOP_N} liquidez`,`Os ${TOP_N} ativos com maior volume financeiro médio (preço de fechamento × volume).`,`Top ${TOP_N} · média dos últimos ${c.liq_days} pregões`],
    ]],
    ['RSI', [
      [`RSI < ${RSI_LOW}`,'RSI de 14 períodos (suavização de Wilder) abaixo do limite: sobrevenda, o papel caiu bastante.',`Limite: ${RSI_LOW}`],
      [`RSI > ${RSI_HIGH}`,'RSI de 14 períodos acima do limite: sobrecompra, o papel subiu bastante.',`Limite: ${RSI_HIGH}`],
    ]],
    ['Médias móveis', [
      ['MA9 acima da SMA20','Situação de hoje: a média simples de 9 dias está acima da média simples de 20 dias, não importa quando cruzou.','MA9 e SMA20 sobre o fechamento diário'],
      ['Cruz. MA9↑SMA20','A MA9 cruzou a SMA20 de baixo para cima. Aparece na lista como 9↑20.',cross],
      ['Cruz. MA9↓SMA20','A MA9 cruzou a SMA20 de cima para baixo. Aparece como 9↓20.',cross],
      ['Cruz. SMA20↑EMA50','A média simples de 20 dias cruzou a média exponencial de 50 dias de baixo para cima. Aparece como 20↑50.',cross],
      ['Cruz. SMA20↓EMA50','A média simples de 20 dias cruzou a média exponencial de 50 dias de cima para baixo. Aparece como 20↓50.',cross],
    ]],
    ['Divergência de alta', [
      ['Diverg. de alta (RSI ou MACD)','O preço faz um fundo mais baixo, mas o RSI ou o MACD faz um fundo mais alto: a queda está perdendo força. No gráfico, uma linha tracejada liga os dois fundos no preço e no indicador.','Basta uma das duas divergências (regras abaixo)'],
      ['Diverg. de alta RSI','Divergência entre o preço e o RSI (linha verde no gráfico).',divCfg(rsiCfg)],
      ['Diverg. de alta MACD','Divergência entre o preço e o MACD (linha azul clara no gráfico).',divCfg(macdCfg)],
    ]],
  ];
  return groups.map(([g,items])=>`<h3>${g}</h3>`+items.map(([t,d,s])=>`<div class="li"><b>${t}</b><p>${d}</p><small>${s}</small></div>`).join('')).join('')
    + '<h3>Observação</h3><div class="li"><p>Estes filtros são informação técnica calculada com dados diários do Yahoo Finance, não recomendação de compra ou venda. Os parâmetros ficam no topo do arquivo scripts/build.py.</p></div>';
}
function toggleLegend(on){ if(on) $('#mbody').innerHTML = legendHtml(); $('#modal').classList.toggle('show',on); }
$('#info').onclick=()=>toggleLegend(true);
$('#mclose').onclick=()=>toggleLegend(false);
$('#modal').addEventListener('click',e=>{ if(e.target.id==='modal') toggleLegend(false); });

$('#back').onclick=()=>{ $('#view').classList.remove('show'); if(chart){chart.remove();chart=null;} $('#plabels').innerHTML=''; };
$('#prev').onclick=()=>openTicker(Math.max(0,curIdx-1));
$('#next').onclick=()=>openTicker(Math.min(shown.length-1,curIdx+1));

(async()=>{
  try{
    const r = await (await fetch('data/index.json',{cache:'no-cache'})).json();
    ITEMS = r.items; CD = r.cross_days || 3; if(r.config) CFG = r.config;
    $('#upd').textContent = 'Atualizado ' + new Date(r.updated).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'}) + ' · ' + r.count + ' ativos';
    buildChips(); render();
  }catch(e){ $('#list').innerHTML='<div class="empty">Dados ainda não gerados. Rode o workflow no GitHub.</div>'; }
})();
</script>
</body>
</html>
